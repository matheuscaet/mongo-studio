[package]
name = "mongo-studio"
version = "1.0.3"
description = "An open-source MongoDB GUI client"
authors = ["Matheus Caetano"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mongo_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
mongodb = { version = "3.9.1", default-features = false, features = ["rustls-tls", "aws-auth", "bson-3", "compat-3-3-0", "cert-key-password", "dns-resolver"] }
bson = { version = "3.1.0", features = ["serde_with-3", "chrono-0_4", "serde", "serde_json-1"] }
keyring = { version = "4.2.0", default-features = false, features = ["apple-native-keyring-store", "v1", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
russh = "0.63.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
aes-gcm = "0.11.1"
rand = "0.10.2"
base64 = "0.23.1"
urlencoding = "2.1.3"
futures-util = { version = "0.3.34", features = ["io"] }
rquickjs = { version = "0.14.0", features = ["futures", "macro"] }
csv = "1.4.0"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2"
log = "0.4"
time = { version = "0.3", features = ["local-offset"] }

# Only needed to force-enable apple-native-keyring-store's own "keychain"
# feature (keyring's own feature flag doesn't do that for us). Gated to
# macOS since this crate's CoreFoundation-based code doesn't build on
# Windows/Linux, and keyring's own cross-platform dependency already
# handles those targets on its own.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
